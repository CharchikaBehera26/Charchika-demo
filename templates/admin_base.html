<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SrujanSetu Admin{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
  <header class="admin-top">
    <a class="brand" href="{{ url_for('public.home') }}">
      <span class="brand-mark">✺</span>
      <span><b>SrujanSetu</b><small>Administration</small></span>
    </a>
    <nav class="admin-top-right" aria-label="Admin navigation">
      <a href="{{ url_for('public.home') }}">View website ↗</a>
      {% if admin_logged_in %}
      <form method="post" action="{{ url_for('admin.admin_logout') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <button class="logout-btn" type="submit">Sign out</button>
      </form>
      {% endif %}
    </nav>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-wrap" role="status">
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}

  <main>
    {% block admin_content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
