{% extends "base.html" %}{% block title %}Edit My Profile — SrujanSetu{% endblock %}{% block content %}
<section class="page-hero"><span class="eyebrow">YOUR PUBLIC MAKER PROFILE</span><h1>Edit <em>Profile</em></h1><p>Changes appear in the public Find Artisans directory.</p></section>
<section class="content-wrap auth-content"><div class="auth-card wide"><form method="post" enctype="multipart/form-data" class="stack-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Full name<input name="name" required value="{{ profile.name }}"></label><label>Craft / skill<input name="craft" required value="{{ profile.craft }}"></label><label>District<input name="district" required value="{{ profile.district }}"></label><label>Experience<input name="experience" value="{{ profile.get('experience','') }}" placeholder="e.g. 15 years"></label><label>Biography<textarea name="bio" rows="4">{{ profile.get('bio','') }}</textarea></label><label>Profile image <small>PNG/JPG/WEBP/GIF · max 5 MB</small><input type="file" name="image_file" accept=".png,.jpg,.jpeg,.gif,.webp"></label>{% if profile.get('image') %}<img class="portal-preview" src="{{ profile.image }}" alt="Current profile image">{% endif %}<button class="btn btn-green">Save profile →</button></form></div></section>{% endblock %}
