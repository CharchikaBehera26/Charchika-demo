{% extends "base.html" %}{% block title %}{{ mode }} Product — SrujanSetu{% endblock %}{% block content %}
<section class="page-hero"><span class="eyebrow">YOUR MARKETPLACE</span><h1>{{ mode }} <em>Product</em></h1><p>Share details about your handmade product.</p></section>
<section class="content-wrap auth-content"><div class="auth-card wide"><form method="post" enctype="multipart/form-data" class="stack-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Product name<input name="name" required value="{{ product.get('name','') }}"></label><label>Craft type<input name="craft" value="{{ product.get('craft','') }}"></label><label>Price<input name="price" required value="{{ product.get('price','') }}" placeholder="e.g. ₹1,200"></label><label>Description<textarea name="description" rows="4">{{ product.get('description','') }}</textarea></label><label>Product photo <small>PNG/JPG/WEBP/GIF · max 5 MB</small><input type="file" name="image_file" accept=".png,.jpg,.jpeg,.gif,.webp"></label>{% if product.get('image') %}<img class="portal-preview" src="{{ product.image }}" alt="Current product image">{% endif %}<button class="btn btn-green">{{ mode }} product →</button><a class="text-link" href="{{ url_for('artisan_products') }}">Cancel</a></form></div></section>{% endblock %}
